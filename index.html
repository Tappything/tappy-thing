<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tappy Thing - Aerus Command Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; min-height: 100vh; position: relative; padding-bottom: 80px; }
    h1 { text-align: center; margin-bottom: 4px; color: #38bdf8; font-size: 1.8rem; }
    p.sub { text-align: center; color: #94a3b8; margin-bottom: 24px; font-size: 0.95rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; max-width: 1100px; margin: 0 auto; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
    .card h2 { color: #f1f5f9; font-size: 1.3rem; margin-bottom: 4px; }
    .card p.role { color: #38bdf8; font-size: 0.85rem; margin-bottom: 16px; font-weight: 600; }
    .btn { width: 100%; background: #0284c7; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-bottom: 8px; text-decoration: none; display: block; text-align: center; }
    .btn:hover { background: #0369a1; }
    .btn.green { background: #16a34a; }
    .btn.green:hover { background: #15803d; }
    .btn.gold { background: #d97706; color: white; }
    .btn.gold:hover { background: #b45309; }
    .intake-box { display: none; margin-top: 10px; padding: 10px; background: #0f172a; border-radius: 8px; border: 1px solid #334155; }
    .intake-box input[type="text"] { width: 100%; padding: 8px; margin-bottom: 8px; border-radius: 4px; border: 1px solid #334155; background: #1e293b; color: #fff; }
    .intake-box input[type="file"] { margin-bottom: 8px; color: #cbd5e1; font-size: 0.8rem; }
    .task-list { margin-top: 12px; max-height: 250px; overflow-y: auto; display: none; background: #0f172a; border-radius: 6px; padding: 8px; }
    .task-item { padding: 8px; border-bottom: 1px solid #334155; font-size: 0.85rem; color: #cbd5e1; }
    .task-item:last-child { border-bottom: none; }
    .loading { color: #f59e0b; font-size: 0.85rem; text-align: center; padding: 8px; }
    .error { color: #ef4444; font-size: 0.85rem; text-align: center; padding: 8px; }
  </style>
</head>
<body>

  <h1>Tappy Thing</h1>
  <p class="sub">Aerus Command Hub & Role Portal</p>

  <div class="grid">
    <div class="card">
      <h2>William</h2>
      <p class="role">Command & Strategy Lead</p>
      <button class="btn" onclick="fetchTasks('William')">View Active Tasks</button>
      <button class="btn green" onclick="toggleIntake('William')">📷 Mobile Intake</button>
      <div id="intake-William" class="intake-box">
        <input type="text" id="name-William" placeholder="Customer Name">
        <input type="file" id="file-William" accept="image/*" capture="environment">
        <button class="btn green" onclick="submitIntake('William')">Submit Intake</button>
      </div>
      <a href="https://gemini.google.com" target="_blank" class="btn green">Fresh 🤵</a>
      <a href="https://towsonhealthyhomes.monday.com/boards/18424728273" target="_blank" class="btn gold">Sissy 💛</a>
      <div id="tasks-William" class="task-list"></div>
    </div>

    <div class="card">
      <h2>Chris</h2>
      <p class="role">Bench, Parts & Repair Lead</p>
      <button class="btn" onclick="fetchTasks('Chris')">View Active Tasks</button>
      <button class="btn green" onclick="toggleIntake('Chris')">📷 Bench Intake</button>
      <div id="intake-Chris" class="intake-box">
        <input type="text" id="name-Chris" placeholder="Customer Name">
        <input type="file" id="file-Chris" accept="image/*" capture="environment">
        <button class="btn green" onclick="submitIntake('Chris')">Submit Intake</button>
      </div>
      <a href="https://gemini.google.com" target="_blank" class="btn green">Fresh 🤵</a>
      <div id="tasks-Chris" class="task-list"></div>
    </div>

    <div class="card">
      <h2>Mona</h2>
      <p class="role">Digital, Intakes & Audio Prompting</p>
      <button class="btn" onclick="fetchTasks('Mona')">View Active Tasks</button>
      <button class="btn green" onclick="toggleIntake('Mona')">📷 Counter Intake</button>
      <div id="intake-Mona" class="intake-box">
        <input type="text" id="name-Mona" placeholder="Customer Name">
        <input type="file" id="file-Mona" accept="image/*" capture="environment">
        <button class="btn green" onclick="submitIntake('Mona')">Submit Intake</button>
      </div>
      <a href="https://gemini.google.com" target="_blank" class="btn green">Fresh 🤵</a>
      <div id="tasks-Mona" class="task-list"></div>
    </div>

    <div class="card">
      <h2>Norby</h2>
      <p class="role">FOAS Entry & Customer Outreach</p>
      <button class="btn" onclick="fetchTasks('Norby')">View Active Tasks</button>
      <a href="https://gemini.google.com" target="_blank" class="btn green">Fresh 🤵</a>
      <div id="tasks-Norby" class="task-list"></div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://square-wildflower-1c4a.william-f4c.workers.dev";
    const BOARD_ID = 18424728273;
    const INTAKE_EMAIL = "board-18424728273@use1.monday.com";

    function toggleIntake(role) {
      const box = document.getElementById(`intake-${role}`);
      box.style.display = box.style.display === "block" ? "none" : "block";
    }

    function submitIntake(role) {
      const name = document.getElementById(`name-${role}`).value;
      if (!name) return alert("Please enter customer name.");
      
      const subject = encodeURIComponent(`Intake: ${name}`);
      const body = encodeURIComponent(`New intake form submitted for ${name} via ${role} Portal.`);
      
      window.location.href = `mailto:${INTAKE_EMAIL}?subject=${subject}&body=${body}`;
      
      document.getElementById(`name-${role}`).value = '';
      toggleIntake(role);
    }

    async function fetchTasks(role) {
      const container = document.getElementById(`tasks-${role}`);
      container.style.display = "block";

      if (role === 'Mona' || role === 'Norby') {
        container.innerHTML = `<div class="task-item">No active items found.</div>`;
        return;
      }

      container.innerHTML = `<div class="loading">Loading tasks...</div>`;

      const graphqlQuery = {
        query: `{ boards(ids: [${BOARD_ID}]) { items_page { items { id name column_values { id text value } } } } }`
      };

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(graphqlQuery)
        });

        const result = await response.json();

        if (result.errors) {
          container.innerHTML = `<div class="error">API Error: ${result.errors[0].message}</div>`;
          return;
        }

        const items = result.data?.boards[0]?.items_page?.items || [];

        const filteredItems = items.filter(item => {
          let statusText = '';
          let ownerText = '';

          item.column_values.forEach(col => {
            const val = (col.value || '').toLowerCase();
            const txt = (col.text || '').toLowerCase();

            statusText += ' ' + txt;
            ownerText += ' ' + txt + ' ' + val;
          });

          if (role === 'William') {
            return !statusText.includes('completed') && !statusText.includes('done');
          }
          if (role === 'Chris') {
            return ownerText.includes('112521282');
          }
          return false;
        });

        if (filteredItems.length === 0) {
          container.innerHTML = `<div class="task-item">No active items found for ${role}.</div>`;
          return;
        }

        container.innerHTML = filteredItems.map(item => `<div class="task-item">📌 ${item.name}</div>`).join("");

      } catch (err) {
        container.innerHTML = `<div class="error">Connection failed. Check Worker endpoint.</div>`;
      }
    }
  </script>
</body>
</html>
